# SPDX-License-Identifier: AGPL-3.0-or-later
# Verificação de todo envio: formatação, clippy, testes (com o teste de
# arquitetura) e cobertura por camada com catraca (tools/cobertura.py).
# O LibreOffice sem interface abre os .docx/.xlsx/.pptx exportados nos
# testes de ponta a ponta (sem ele, esses testes só conferem o pacote).
# Também é chamado pelo workflow Release antes de publicar pacotes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit ou tag a verificar"
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  verificacao:
    name: fmt, clippy, testes e cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libqpdf-dev libturbojpeg0-dev zlib1g-dev \
            poppler-utils qpdf tesseract-ocr tesseract-ocr-eng unzip \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
          rustup component add llvm-tools-preview rustfmt clippy
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Testes e cobertura (mínimos por camada e catraca)
        run: python3 tools/cobertura.py
